<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img">
  <title>Better Profile Pictures</title>
  <!--
    The Kalos Tech favicon, geometry untouched, with the light and inverse
    variants folded into one file: the brand ships them as two assets, but a
    manifest icon is a single path rendered against whichever theme the user
    runs. Gecko honours prefers-color-scheme in an SVG used as an image, and
    the light values are the plain fills, so a renderer that ignores the query
    still gets the correct on-brand mark rather than an invisible one.
  -->
  <style>
    :root { --mark: #12141c; }
    @media (prefers-color-scheme: dark) { :root { --mark: #f6f6f9; } }
  </style>
  <rect x="3.84" y="11.52" width="42.24" height="12.8" rx="6.4" fill="var(--mark)"/>
  <rect x="21.76" y="39.68" width="38.4" height="12.8" rx="6.4" fill="var(--mark)"/>
</svg>
